AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Brazvia API — BRAZVIA API — NestJS on Lambda + optional managed PostgreSQL

Globals:
  Function:
    Timeout: 29
    MemorySize: 1024
    Runtime: nodejs20.x
    Architectures:
      - x86_64
    Environment:
      Variables:
        NODE_ENV: production
        PATH_PREFIX: api
        STAGE: !Ref Stage

Conditions:
  CreateManagedDatabase: !Equals [!Ref CreateManagedDatabase, "true"]

Parameters:
  Stage:
    Type: String
    Default: production
    AllowedValues:
      - production
  CreateManagedDatabase:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: true = SAM cria VPC + RDS Postgres; false = use DbHost/DbUser/DbPassword externos
  DbInstanceClass:
    Type: String
    Default: db.t4g.micro
    Description: Classe da instância RDS (somente quando CreateManagedDatabase=true)
  NatInstanceType:
    Type: String
    Default: t4g.nano
    Description: Tipo da instância fck-nat (somente quando CreateManagedDatabase=true)
  BastionInstanceType:
    Type: String
    Default: t4g.nano
    Description: Tipo da instância bastion (SSM) para acesso ao RDS
  BastionAmiId:
    Type: String
    Default: ami-04818ab2efa58d4db
    Description: AMI Amazon Linux 2023 arm64 em sa-east-1
  FckNatAmiId:
    Type: String
    Default: ami-0999e4dc33fa616a1
    Description: AMI fck-nat AL2023 arm64 em sa-east-1 (atualize com aws ec2 describe-images --owners 568608671756)
  RunDbSeed:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Executa seeders após migrations na Lambda brazvia-migrate
  DbHost:
    Type: String
    Default: ""
    Description: Host externo (obrigatório quando CreateManagedDatabase=false)
  DbPort:
    Type: String
    Default: "5432"
  DbName:
    Type: String
    Default: brazvia
  DbUser:
    Type: String
    Default: ""
    Description: Usuário externo (obrigatório quando CreateManagedDatabase=false)
  DbPassword:
    Type: String
    Default: ""
    NoEcho: true
    Description: Senha externa (obrigatório quando CreateManagedDatabase=false)
  CognitoMock:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
  CognitoAdminGroup:
    Type: String
    Default: admin
  CorsOrigin:
    Type: String
    Default: "*"
  AllowBootstrapAdmin:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: true = permite POST /api/users/register com X-Bootstrap-Secret (desligue apos criar o primeiro admin)
  BootstrapAdminSecret:
    Type: String
    Default: ""
    NoEcho: true
    Description: Secret do header X-Bootstrap-Secret (obrigatorio quando AllowBootstrapAdmin=true)

Resources:
  BrazviaUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub brazvia-users-${Stage}
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: true

  BrazviaUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub brazvia-web-${Stage}
      UserPoolId: !Ref BrazviaUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH

  BrazviaAdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: !Ref CognitoAdminGroup
      UserPoolId: !Ref BrazviaUserPool
      Description: Administradores do painel Brazvia

  BrazviaStaffGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: staff
      UserPoolId: !Ref BrazviaUserPool
      Description: Equipe Brazvia

  BrazviaImagesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub brazvia-images-${Stage}-${AWS::AccountId}
      OwnershipControls:
        Rules:
          - ObjectOwnership: ObjectWriter
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - GET
              - HEAD
            AllowedOrigins:
              - !Ref CorsOrigin
            MaxAge: 3600

  BrazviaImagesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BrazviaImagesBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublicReadPropertyImages
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub ${BrazviaImagesBucket.Arn}/properties/*

  # --- VPC (somente banco gerenciado) ---
  BrazviaVpc:
    Type: AWS::EC2::VPC
    Condition: CreateManagedDatabase
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub brazvia-vpc-${Stage}

  BrazviaInternetGateway:
    Type: AWS::EC2::InternetGateway
    Condition: CreateManagedDatabase
    Properties:
      Tags:
        - Key: Name
          Value: !Sub brazvia-igw-${Stage}

  BrazviaVpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Condition: CreateManagedDatabase
    Properties:
      VpcId: !Ref BrazviaVpc
      InternetGatewayId: !Ref BrazviaInternetGateway

  BrazviaPublicSubnet1:
    Type: AWS::EC2::Subnet
    Condition: CreateManagedDatabase
    Properties:
      VpcId: !Ref BrazviaVpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub brazvia-public-1-${Stage}

  BrazviaPublicSubnet2:
    Type: AWS::EC2::Subnet
    Condition: CreateManagedDatabase
    Properties:
      VpcId: !Ref BrazviaVpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: 10.0.2.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub brazvia-public-2-${Stage}

  BrazviaPrivateSubnet1:
    Type: AWS::EC2::Subnet
    Condition: CreateManagedDatabase
    Properties:
      VpcId: !Ref BrazviaVpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: 10.0.10.0/24
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub brazvia-private-1-${Stage}

  BrazviaPrivateSubnet2:
    Type: AWS::EC2::Subnet
    Condition: CreateManagedDatabase
    Properties:
      VpcId: !Ref BrazviaVpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: 10.0.11.0/24
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub brazvia-private-2-${Stage}

  # fck-nat — NAT instance (~US$ 3/mês) em vez de NAT Gateway (~US$ 32/mês)
  # https://fck-nat.dev/deploying/
  BrazviaNatSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: CreateManagedDatabase
    Properties:
      GroupDescription: fck-nat NAT instance - VPC egress to internet
      VpcId: !Ref BrazviaVpc
      SecurityGroupIngress:
        - IpProtocol: -1
          CidrIp: 10.0.0.0/16
          Description: All traffic from VPC CIDR
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: All outbound traffic

  BrazviaFckNatRole:
    Type: AWS::IAM::Role
    Condition: CreateManagedDatabase
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: fckNatEniPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ec2:AttachNetworkInterface
                  - ec2:ModifyNetworkInterfaceAttribute
                  - ec2:AssociateAddress
                  - ec2:DisassociateAddress
                Resource: "*"

  BrazviaFckNatInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Condition: CreateManagedDatabase
    Properties:
      Roles:
        - !Ref BrazviaFckNatRole

  BrazviaFckNatEni:
    Type: AWS::EC2::NetworkInterface
    Condition: CreateManagedDatabase
    Properties:
      SubnetId: !Ref BrazviaPublicSubnet1
      GroupSet:
        - !Ref BrazviaNatSecurityGroup
      SourceDestCheck: false
      Tags:
        - Key: Name
          Value: !Sub brazvia-fck-nat-eni-${Stage}

  BrazviaFckNatLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Condition: CreateManagedDatabase
    DependsOn:
      - BrazviaFckNatEni
      - BrazviaFckNatRole
    Properties:
      LaunchTemplateName: !Sub brazvia-fck-nat-${Stage}
      LaunchTemplateData:
        ImageId: !Ref FckNatAmiId
        InstanceType: !Ref NatInstanceType
        IamInstanceProfile:
          Arn: !GetAtt BrazviaFckNatInstanceProfile.Arn
        SecurityGroupIds:
          - !Ref BrazviaNatSecurityGroup
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            echo "eni_id=${BrazviaFckNatEni}" >> /etc/fck-nat.conf
            service fck-nat restart

  BrazviaFckNatAsg:
    Type: AWS::AutoScaling::AutoScalingGroup
    Condition: CreateManagedDatabase
    DependsOn:
      - BrazviaFckNatLaunchTemplate
      - BrazviaPublicSubnet1RouteTableAssociation
    Properties:
      AutoScalingGroupName: !Sub brazvia-fck-nat-${Stage}
      MinSize: 1
      MaxSize: 1
      DesiredCapacity: 1
      VPCZoneIdentifier:
        - !Ref BrazviaPublicSubnet1
      LaunchTemplate:
        LaunchTemplateId: !Ref BrazviaFckNatLaunchTemplate
        Version: !GetAtt BrazviaFckNatLaunchTemplate.LatestVersionNumber
      Tags:
        - Key: Name
          Value: !Sub brazvia-fck-nat-${Stage}
          PropagateAtLaunch: true
    UpdatePolicy:
      AutoScalingScheduledAction:
        IgnoreUnmodifiedGroupSizeProperties: true

  BrazviaPublicRouteTable:
    Type: AWS::EC2::RouteTable
    Condition: CreateManagedDatabase
    Properties:
      VpcId: !Ref BrazviaVpc
      Tags:
        - Key: Name
          Value: !Sub brazvia-public-rt-${Stage}

  BrazviaPublicRoute:
    Type: AWS::EC2::Route
    Condition: CreateManagedDatabase
    DependsOn: BrazviaVpcGatewayAttachment
    Properties:
      RouteTableId: !Ref BrazviaPublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref BrazviaInternetGateway

  BrazviaPublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateManagedDatabase
    Properties:
      SubnetId: !Ref BrazviaPublicSubnet1
      RouteTableId: !Ref BrazviaPublicRouteTable

  BrazviaPublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateManagedDatabase
    Properties:
      SubnetId: !Ref BrazviaPublicSubnet2
      RouteTableId: !Ref BrazviaPublicRouteTable

  BrazviaPrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Condition: CreateManagedDatabase
    Properties:
      VpcId: !Ref BrazviaVpc
      Tags:
        - Key: Name
          Value: !Sub brazvia-private-rt-${Stage}

  BrazviaPrivateRoute:
    Type: AWS::EC2::Route
    Condition: CreateManagedDatabase
    DependsOn:
      - BrazviaFckNatEni
      - BrazviaFckNatAsg
    Properties:
      RouteTableId: !Ref BrazviaPrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NetworkInterfaceId: !Ref BrazviaFckNatEni

  BrazviaPrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateManagedDatabase
    Properties:
      SubnetId: !Ref BrazviaPrivateSubnet1
      RouteTableId: !Ref BrazviaPrivateRouteTable

  BrazviaPrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateManagedDatabase
    Properties:
      SubnetId: !Ref BrazviaPrivateSubnet2
      RouteTableId: !Ref BrazviaPrivateRouteTable

  BrazviaS3VpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: CreateManagedDatabase
    Properties:
      VpcId: !Ref BrazviaVpc
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      RouteTableIds:
        - !Ref BrazviaPrivateRouteTable
        - !Ref BrazviaPublicRouteTable
      VpcEndpointType: Gateway

  BrazviaLambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: CreateManagedDatabase
    Properties:
      GroupDescription: Lambda Brazvia API
      VpcId: !Ref BrazviaVpc
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  BrazviaDbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: CreateManagedDatabase
    Properties:
      GroupDescription: RDS PostgreSQL Brazvia
      VpcId: !Ref BrazviaVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref BrazviaLambdaSecurityGroup
          Description: Lambda API
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref BrazviaBastionSecurityGroup
          Description: Bastion SSM


  # Bastion (SSM Session Manager) — acesso ao RDS privado sem SSH público
  BrazviaBastionSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: CreateManagedDatabase
    Properties:
      GroupDescription: Bastion Brazvia (SSM only, sem inbound)
      VpcId: !Ref BrazviaVpc
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Outbound for SSM + Postgres

  BrazviaBastionRole:
    Type: AWS::IAM::Role
    Condition: CreateManagedDatabase
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  BrazviaBastionInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Condition: CreateManagedDatabase
    Properties:
      Roles:
        - !Ref BrazviaBastionRole

  BrazviaBastionInstance:
    Type: AWS::EC2::Instance
    Condition: CreateManagedDatabase
    Properties:
      InstanceType: !Ref BastionInstanceType
      ImageId: !Ref BastionAmiId
      IamInstanceProfile: !Ref BrazviaBastionInstanceProfile
      NetworkInterfaces:
        - AssociatePublicIpAddress: true
          DeviceIndex: 0
          SubnetId: !Ref BrazviaPublicSubnet1
          GroupSet:
            - !Ref BrazviaBastionSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub brazvia-bastion-${Stage}

  BrazviaDbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Condition: CreateManagedDatabase
    Properties:
      DBSubnetGroupDescription: Brazvia Postgres subnets
      SubnetIds:
        - !Ref BrazviaPrivateSubnet1
        - !Ref BrazviaPrivateSubnet2
      Tags:
        - Key: Name
          Value: !Sub brazvia-db-subnets-${Stage}

  BrazviaDbSecret:
    Type: AWS::SecretsManager::Secret
    Condition: CreateManagedDatabase
    Properties:
      Description: !Sub Credenciais do Postgres Brazvia (${Stage})
      GenerateSecretString:
        SecretStringTemplate: '{"username":"brazvia"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludeCharacters: '"@/\`'

  BrazviaDatabase:
    Type: AWS::RDS::DBInstance
    Condition: CreateManagedDatabase
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub brazvia-db-${Stage}
      Engine: postgres
      EngineVersion: "16.14"
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: 20
      StorageType: gp3
      StorageEncrypted: true
      DBName: !Ref DbName
      MasterUsername: brazvia
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${BrazviaDbSecret}:SecretString:password}}'
      VPCSecurityGroups:
        - !Ref BrazviaDbSecurityGroup
      DBSubnetGroupName: !Ref BrazviaDbSubnetGroup
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 7
      DeletionProtection: false
      Tags:
        - Key: Name
          Value: !Sub brazvia-db-${Stage}

  BrazviaHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      CorsConfiguration:
        AllowOrigins:
          - !Ref CorsOrigin
        AllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
          - X-Bootstrap-Secret
          - ngrok-skip-browser-warning

  BrazviaApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub brazvia-api-${Stage}
      Handler: lambda.handler
      CodeUri: .
      Description: Brazvia catalog API (NestJS)
      VpcConfig: !If
        - CreateManagedDatabase
        - SecurityGroupIds:
            - !Ref BrazviaLambdaSecurityGroup
          SubnetIds:
            - !Ref BrazviaPrivateSubnet1
            - !Ref BrazviaPrivateSubnet2
        - !Ref AWS::NoValue
      Environment:
        Variables:
          DB_HOST: !If
            - CreateManagedDatabase
            - !GetAtt BrazviaDatabase.Endpoint.Address
            - !Ref DbHost
          DB_PORT: !If
            - CreateManagedDatabase
            - !GetAtt BrazviaDatabase.Endpoint.Port
            - !Ref DbPort
          DB_NAME: !Ref DbName
          DB_USER: !If
            - CreateManagedDatabase
            - brazvia
            - !Ref DbUser
          DB_PASSWORD: !If
            - CreateManagedDatabase
            - !Sub '{{resolve:secretsmanager:${BrazviaDbSecret}:SecretString:password}}'
            - !Ref DbPassword
          COGNITO_MOCK: !Ref CognitoMock
          COGNITO_REGION: !Ref AWS::Region
          COGNITO_USER_POOL_ID: !Ref BrazviaUserPool
          COGNITO_CLIENT_ID: !Ref BrazviaUserPoolClient
          COGNITO_ADMIN_GROUP: !Ref CognitoAdminGroup
          CORS_ORIGIN: !Ref CorsOrigin
          ALLOW_BOOTSTRAP_ADMIN: !Ref AllowBootstrapAdmin
          BOOTSTRAP_ADMIN_SECRET: !Ref BootstrapAdminSecret
          S3_BUCKET: !Ref BrazviaImagesBucket
          S3_REGION: !Ref AWS::Region
          S3_PROPERTIES_PREFIX: properties
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref BrazviaImagesBucket
        - AWSLambdaVPCAccessExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminGetUser
                - cognito-idp:AdminAddUserToGroup
                - cognito-idp:AdminSetUserPassword
                - cognito-idp:InitiateAuth
                - cognito-idp:RespondToAuthChallenge
              Resource: !GetAtt BrazviaUserPool.Arn
      Events:
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref BrazviaHttpApi
            Path: /
            Method: ANY
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref BrazviaHttpApi
            Path: /{proxy+}
            Method: ANY
    Metadata:
      BuildMethod: makefile

  BrazviaMigrateFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub brazvia-migrate-${Stage}
      Handler: migrate.handler
      CodeUri: .
      Description: Executa migrations e seeders Sequelize
      Timeout: 300
      MemorySize: 512
      VpcConfig: !If
        - CreateManagedDatabase
        - SecurityGroupIds:
            - !Ref BrazviaLambdaSecurityGroup
          SubnetIds:
            - !Ref BrazviaPrivateSubnet1
            - !Ref BrazviaPrivateSubnet2
        - !Ref AWS::NoValue
      Environment:
        Variables:
          DB_HOST: !If
            - CreateManagedDatabase
            - !GetAtt BrazviaDatabase.Endpoint.Address
            - !Ref DbHost
          DB_PORT: !If
            - CreateManagedDatabase
            - !GetAtt BrazviaDatabase.Endpoint.Port
            - !Ref DbPort
          DB_NAME: !Ref DbName
          DB_USER: !If
            - CreateManagedDatabase
            - brazvia
            - !Ref DbUser
          DB_PASSWORD: !If
            - CreateManagedDatabase
            - !Sub '{{resolve:secretsmanager:${BrazviaDbSecret}:SecretString:password}}'
            - !Ref DbPassword
          RUN_DB_SEED: !Ref RunDbSeed
      Policies:
        - AWSLambdaVPCAccessExecutionRole
    Metadata:
      BuildMethod: makefile

Outputs:
  ApiUrl:
    Description: HTTP API endpoint
    Value: !Sub https://${BrazviaHttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
  FunctionArn:
    Description: Lambda ARN
    Value: !GetAtt BrazviaApiFunction.Arn
  MigrateFunctionName:
    Description: Lambda que roda migrations/seeders (invocada pelo pipeline)
    Value: !Ref BrazviaMigrateFunction
  ImagesBucketName:
    Description: S3 bucket para imagens de imóveis
    Value: !Ref BrazviaImagesBucket
  ImagesBucketUrl:
    Description: URL pública base do bucket de imagens
    Value: !Sub https://${BrazviaImagesBucket}.s3.${AWS::Region}.amazonaws.com
  CognitoUserPoolId:
    Description: ID do User Pool Cognito
    Value: !Ref BrazviaUserPool
  CognitoClientId:
    Description: ID do App Client Cognito (SPA)
    Value: !Ref BrazviaUserPoolClient
  DbEndpoint:
    Condition: CreateManagedDatabase
    Description: Endpoint do RDS gerenciado pelo SAM
    Value: !GetAtt BrazviaDatabase.Endpoint.Address
  DbSecretArn:
    Condition: CreateManagedDatabase
    Description: ARN do secret com credenciais do Postgres
    Value: !Ref BrazviaDbSecret
  BastionInstanceId:
    Condition: CreateManagedDatabase
    Description: EC2 bastion (SSM) para túnel até o RDS
    Value: !Ref BrazviaBastionInstance
  FckNatAsgName:
    Condition: CreateManagedDatabase
    Description: Auto Scaling Group do fck-nat (NAT instance econômica)
    Value: !Ref BrazviaFckNatAsg
